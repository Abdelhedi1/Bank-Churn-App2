<form id="{{ form_id }}" class="form-grid" novalidate>
  <label data-col="age">Age<input type="number" name="age" min="18" max="100" value="38" required></label>
  <label data-col="gender">Gender<select name="gender"><option>Male</option><option>Female</option></select></label>
  <label data-col="tenure">Tenure (years)<input type="number" name="tenure" min="0" max="10" value="5" required></label>
  <label data-col="balance">Balance<input type="number" name="balance" min="0" step="100" value="75000" required></label>
  <label data-col="credit_score">Credit score<input type="number" name="credit_score" min="300" max="850" value="650" required></label>
  <label data-col="country">Country<select name="country"><option>France</option><option>Germany</option><option>Spain</option></select></label>
  <label data-col="products_number">Products used<select name="products_number"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
  <label data-col="estimated_salary">Estimated salary<input type="number" name="estimated_salary" min="0" step="1000" value="100000" required></label>
  <label data-col="credit_card">Credit card<select name="credit_card"><option value="1">Yes</option><option value="0">No</option></select></label>
  <label data-col="active_member">Activity level<select name="active_member"><option value="1">Active</option><option value="0">Inactive</option></select></label>
</form>
